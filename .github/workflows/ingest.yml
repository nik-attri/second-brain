name: second-brain

# Deterministic scheduling lives in the backend. The LLM never decides when to run.
on:
  schedule:
    - cron: "0 3 * * *"     # 03:00 UTC daily = 08:30 IST
  workflow_dispatch:         # manual trigger, for the demo

jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: python engine/run.py

      - name: Commit the day's brain
        run: |
          git config user.name  "second-brain"
          git config user.email "bot@users.noreply.github.com"
          git add brain logs engine/state
          git diff --staged --quiet || git commit -m "brain: $(date -u +%Y-%m-%d)"
          git push
